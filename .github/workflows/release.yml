name: Release DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish macOS DMG
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        run: |
          BASE_VERSION=$(grep -E 'MARKETING_VERSION:' project.yml | head -n 1 | sed -E 's/.*"([0-9]+\.[0-9]+).*/\1/')
          BASE_VERSION="${BASE_VERSION:-1.0}"
          TAG="v${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Ensure xcodegen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Build and package DMG
        run: |
          chmod +x tools/build.sh tools/package_dmg.sh
          ./tools/package_dmg.sh

      - name: Run self-test
        run: |
          ./build/Build/Products/Release/gofree.app/Contents/MacOS/gofree --selftest

      - name: Prepare release assets
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cp dist/gofree.dmg "dist/gofree-${TAG}-arm64.dmg"
          (cd dist && shasum -a 256 "gofree-${TAG}-arm64.dmg" > SHA256SUMS.txt)
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            "dist/gofree-${TAG}-arm64.dmg" \
            "dist/SHA256SUMS.txt" \
            --title "gofree ${TAG}" \
            --generate-notes \
            --latest
